<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像标签</title>
</head>
<body>
    <h1>图像标签</h1>
    <img src="images/风景.svg" alt="山峰和湖泊" title="一幅风景插画" width="400">
