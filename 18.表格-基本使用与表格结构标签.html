<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格-基本使用与表格结构标签</title>
</head>
<body>
    <table border="1">
        <caption>学生成绩表</caption>
        <thead><tr><th>姓名</th><th>语文</th><th>数学</th></tr></thead>
        <tbody>
            <tr><td>小明</td><td>90</td><td>95</td></tr>
            <tr><td>小红</td><td>92</td><td>96</td></tr>
        </tbody>
        <tfoot><tr><td>平均分</td><td>91</td><td>95.5</td></tr></tfoot>
    </table>
</body>
</html>
