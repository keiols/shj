<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>换行和水平线标签</title>
</head>
<body>
    <h1>春晓</h1>
    <p>春眠不觉晓，<br>处处闻啼鸟。<br>夜来风雨声，<br>花落知多少。</p>
    <hr>
    <p>br 用于换行，hr 用于添加水平线。</p>
</body>
</html>
