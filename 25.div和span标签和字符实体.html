<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>div和span标签和字符实体</title>
</head>
<body>
    <div>第一个 div 独占一行。</div>
    <div>第二个 div 也独占一行。</div>
    <span>第一个 span</span><span>第二个 span</span>
    <p>两个空格：你&nbsp;&nbsp;好</p>
    <p>小于号：&lt;，大于号：&gt;，与号：&amp;，版权符号：&copy;</p>
    <p>显示标签文字：&lt;p&gt;段落&lt;/p&gt;</p>
</body>
</html>
