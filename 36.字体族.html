<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字体族</title>
    <style>
        .sans { font-family: "Microsoft YaHei", Arial, sans-serif; }
        .serif { font-family: SimSun, "Times New Roman", serif; }
        .mono { font-family: Consolas, "Courier New", monospace; }
    </style>
</head>
<body>
    <p class="sans">无衬线字体：HTML CSS 网页开发</p>
    <p class="serif">衬线字体：HTML CSS 网页开发</p>
    <p class="mono">等宽字体：0123456789 ABCDEF</p>
</body>
</html>
