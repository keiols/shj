<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮动总结</title>
</head>
<body>
    浮动属性 float,left-左浮动，right-右浮动
    特点：
    浮动后的盒子顶对齐
    浮动后的盒子具备行内块特点
    父级宽度不够，浮动的子级会换行
    浮动后的盒子脱标

    清除浮动：子级浮动，父级没有高度，子级无法撑开父级高度，影响布局效果
    双伪元素法
    浮动的本质作用是实现图文混排效果
</body>
