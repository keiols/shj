<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合并单元格</title>
</head>
<body>
    <table border="1">
        <caption>合并单元格</caption>
        <tr><th colspan="3">课程安排</th></tr>
        <tr><th>时间</th><th>科目</th><th>教室</th></tr>
        <tr><td rowspan="2">上午</td><td>HTML</td><td>101</td></tr>
        <tr><td>CSS</td><td>102</td></tr>
        <tr><td>下午</td><td colspan="2">上机练习</td></tr>
    </table>
</body>
</html>
