<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮动-基本使用</title>
    <style>
        /*顶对齐，具备行内块显示模式特点，浮动的盒子会脱标
        要同时浮动*/
       /*.one {
        width: 100px;
        height: 100px;
        background-color: brown;
        float: left;


       }

       .two {
        width: 200px;
        height: 200px;
        background-color: orange;
         float: right;
       }
*/

       *{
        margin: 0;
        padding: 0;

       }

       li{
        list-style: none;
       }

       .product {
        margin: 50px; auto ;
        width: 1226px;
        height: 628px;
        background-color: pink;
       }

       .left {
        float: left;
        width: 234px;
        height: 628px;
        background-color: blue;
       }

       .right {
        float: right;
        width: 978px;
        height: 628px;
        background-color: brown;
       }

       .right li {
        float: left;
        margin-right: 14px;
        margin-bottom: 14px;
        width: 234px;
        height: 300px;
        background-color: orange;
       }
       /*找到第四个li和第八个li 去掉右侧的margin*/
       .right li:nth-child(4n) {
        margin-right: 0;
       }
    </style>
</head>
<body>
    <div class="one">one</div>
    <div class="two">two</div>
     <!--版心：左右，右面：8个产品——8个li -->
     <div class="product">
     <div class="left"></div>
     <div class="right"> 
        <ul>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
        </ul></div>
       
    </div>
     
</body>
</html>
