<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>内外边距</title>
    <style>
        /*行内元素添加margin和padding,无法改变元素垂直位置
        给行内元素添加line-height可以改变垂直位置*/
      span {
        margin: 50px;
        padding: 20px;
        line-height: 100px ;
      }
    </style>
</head>
<body>
    <span>span标签</span>
    <span>span标签</span>
</body>
</html>
