<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型—内边距</title>
    <style>
    div{
      width: 200px;
      height: 200px;
      background-color: pink;

      padding-top:  60px;
      padding-right: 30px;
      padding-bottom: 60px;
      padding-left: 30px;
      /*四值：上 右 下 左
        三值：上 左右 下
        两值：上下 左右
        记忆方法：从上开始顺时针转一圈，如果当前方向没有数值，取值跟对面一样*/
      padding: 10px 20px 40px 80px;
    }
    </style>
</head>
<body>
    <div>div标签</div>
</body>
</html>
