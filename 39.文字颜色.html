<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字颜色</title>
    <style>
        .name { color: red; }
        .hex { color: #008000; }
        .rgb { color: rgb(0, 0, 255); }
        .rgba { color: rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body>
    <p class="name">颜色英文名：red</p>
    <p class="hex">十六进制：#008000</p>
    <p class="rgb">RGB：rgb(0, 0, 255)</p>
    <p class="rgba">RGBA：半透明的黑色</p>
</body>
</html>
