<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单-label标签</title>
</head>
<body>
    <p><label for="username">用户名：</label><input type="text" id="username"></p>
    <p>
        <input type="radio" id="male" name="gender"><label for="male">男</label>
        <input type="radio" id="female" name="gender"><label for="female">女</label>
    </p>
    <label><input type="checkbox">我已阅读使用说明</label>
</body>
</html>
