<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮动——清除浮动</title>
    <style>

        /*
        方法一：额外标签法
        在父元素内容的最后添加一个块级元素
        设置css属性 clear：both

        方法二：单伪元素法
        .clearfix ::after {
           content: "";
           display: block;
           clear: both;

        方法三：双伪元素法
        .clearfix ::before
        .clearfix ::after {
           content: "";
        display: table;
        }

        .clearfix ::after {
          clear: both;
        }

        方法四：overflow
        父元素添加css属性 overflow:hidden
        */

}
        .top {
            margin: 10px auto;
            width: 1200px;
           /* height: 300px;*/
            background-color: pink;

            overflow: hidden;
        }

        .left {
            float: left;
            width: 200px;
            height: 300px;
            background-color: skyblue;
        }

        .right {
            float: right;
            width: 950px;
            height: 300px;
            background-color: orange;
        }
        .bottom {
            height: 100px;
            background-color: brown;
        }

        /*双伪元素法*/
        .clearfix ::before
        .clearfix ::after {
            content: "";
            display: table;
}

.clearfix ::after {
    clear: both;
}

        /*清除浮动*/
        .clearfix ::after {
            clear: both;
        }

        .clearfix ::after {
            content: "";
            display: block;
            clear: both;
}
    </style>
</head>
<body>
    <div class="top clearfix">
        <div class="left"></div>
        <div class="right"></div>
        <div class="clearfix"></div>
    </div>
    <div class="bottom"></div>

</body>
</html>
