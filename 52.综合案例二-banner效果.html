<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综合案例二-banner效果</title>
    <style>
        .banner {
            height: 360px;
            background: #e2f0ed url("images/banner.svg") no-repeat center / cover;
            text-align: center;
        }
        h1 { font-size: 36px; line-height: 100px; color: #284e43; }
        p { font-size: 20px; color: #436659; }
        a {
            display: inline-block;
            width: 140px;
            height: 44px;
            line-height: 44px;
            background-color: #376b58;
            color: white;
            text-decoration: none;
        }
        a:hover { background-color: #254c3e; }
    </style>
</head>
<body>
    <div class="banner">
        <h1>一起探索前端开发</h1>
        <p>用 HTML 搭建结构，用 CSS 绘制样式。</p>
        <a href="29.体验CSS.html">开始学习</a>
    </div>
</body>
</html>
