<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字体修饰属性-大小和粗细和倾斜</title>
    <style>
        .large { font-size: 30px; }
        .bold { font-weight: 700; }
        .normal { font-weight: 400; }
        .italic { font-style: italic; }
    </style>
</head>
<body>
    <p class="large">字号 30px</p>
    <p class="bold">文字加粗</p>
    <strong class="normal">取消默认加粗</strong>
    <p class="italic">文字倾斜</p>
</body>
</html>
