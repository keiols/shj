<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择器-标签和类</title>
    <style>
        p { color: green; }
        .red { color: red; }
        .large { font-size: 30px; }
    </style>
</head>
<body>
    <p>标签选择器选中所有 p。</p>
    <p class="red">带 red 类的段落。</p>
    <div class="red">不同标签也能使用同一个类。</div>
    <p class="red large">一个标签可以使用多个类。</p>
</body>
</html>
