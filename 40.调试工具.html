<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调试工具</title>
    <style>
        .box {
            width: 200px;
            height: 150px;
            background-color: pink;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="box">用浏览器调试工具检查这个盒子。</div>
    <ol>
        <li>在浏览器中打开这个 HTML 文件，按 F12 打开开发者工具。</li>
        <li>点击选择元素按钮，再点击页面中的粉色盒子。</li>
        <li>在样式面板中尝试修改宽度、颜色和字号。</li>
        <li>刷新页面，观察临时修改是否保留。</li>
    </ol>
</body>
</html>
