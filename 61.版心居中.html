<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>版心居中</title>
    <style>
        div{
          width: 500px;
          height: 200px;
          background-color: pink;
         /*外边距不会撑大盒子*/
         /*版心居中要求盒子必须有宽度*/
          margin: 0 auto;
        }
    </style>
</head>
<body>
    <div>版心居中</div>
</body>
</html>
