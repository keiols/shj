<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型-尺寸计算</title>
    <style>
        
            div{
          width: 200px;
          height: 200px;
          background-color: pink;
        
          padding: 20px;
          box-sizing: border-box;}
          /*盒子尺寸 =  内容尺寸+border尺寸+内边距尺寸
            给盒子加border/padding会撑大盒子
            手动做减法，剪掉border/ppadding的尺寸
            内减模式：box-sizing: border-box 不会撑大盒子*/
    </style>
</head>
<body>
    <div>div标签</div>
</body>
</html>
