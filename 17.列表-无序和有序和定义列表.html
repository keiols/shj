<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>列表-无序和有序和定义列表</title>
</head>
<body>
    <h2>无序列表</h2>
    <ul><li>苹果</li><li>香蕉</li><li>橙子</li></ul>
    <h2>有序列表</h2>
    <ol><li>打开编辑器</li><li>编写代码</li><li>保存并查看效果</li></ol>
    <h2>定义列表</h2>
    <dl>
        <dt>帮助中心</dt><dd>账户管理</dd><dd>购物指南</dd>
        <dt>服务支持</dt><dd>售后政策</dd><dd>联系我们</dd>
    </dl>
</body>
</html>
