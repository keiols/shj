<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多媒体标签-音频和视频</title>
</head>
<body>
    <h1>音频</h1>
    <audio src="media/提示音.wav" controls>
        浏览器不支持音频播放。
    </audio>
    <h1>视频</h1>
    <video src="https://developer.mozilla.org/shared-assets/videos/flower.mp4" controls width="400" poster="images/风景.svg" preload="none">
        浏览器不支持视频播放。
    </video>
    <p>音频保存在本地；视频使用 MDN 的公开示例，需要联网播放。</p>
</body>
</html>
