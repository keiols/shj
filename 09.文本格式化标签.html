<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本格式化标签</title>
</head>
<body>
    <p><strong>加粗：strong</strong>，<b>加粗：b</b></p>
    <p><em>倾斜：em</em>，<i>倾斜：i</i></p>
    <p><ins>下划线：ins</ins>，<u>下划线：u</u></p>
    <p><del>删除线：del</del>，<s>删除线：s</s></p>
</body>
</html>
