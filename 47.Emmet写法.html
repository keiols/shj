<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emmet写法</title>
    <style>
        /* 在 CSS 中输入 w200、h100、bgc 后按 Tab，观察补全结果。 */
        .box { width: 200px; height: 100px; background-color: pink; }
    </style>
</head>
<body>
    <!-- 输入 ul>li*3，再按 Tab，可以生成下面的结构 -->
    <ul>
        <li>列表项 1</li>
        <li>列表项 2</li>
        <li>列表项 3</li>
    </ul>
    <!-- 输入 div.box，可以生成带类名的 div -->
    <div class="box">Emmet 练习</div>
    <!-- 输入 h2{标题}，可以生成带文字的标题 -->
    <h2>标题</h2>
</body>
</html>
