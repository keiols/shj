<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>显示模式</title>
    <style>
        .block { display: block; width: 200px; height: 40px; background-color: pink; }
        .inline-block { display: inline-block; width: 120px; height: 50px; line-height: 50px; background-color: skyblue; }
        .inline { display: inline; background-color: #eee; }
    </style>
</head>
<body>
    <h2>行内元素转换为块级元素</h2>
    <span class="block">第一个 span</span><span class="block">第二个 span</span>
    <h2>行内块元素</h2>
    <a class="inline-block" href="#">链接一</a>
    <a class="inline-block" href="#">链接二</a>
    <h2>块级元素转换为行内元素</h2>
    <div class="inline">第一个 div</div><div class="inline">第二个 div</div>
</body>
</html>
