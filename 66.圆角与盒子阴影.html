<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆角与盒子阴影</title>
    <style>
        .rounded {
            width: 200px;
            height: 100px;
            background-color: pink;
            border-radius: 20px;
            box-shadow: 3px 5px 10px rgba(0, 0, 0, 0.2);
        }
        .circle { width: 100px; height: 100px; border-radius: 50%; background-color: skyblue; }
        .capsule {
            width: 200px;
            height: 60px;
            line-height: 60px;
            text-align: center;
            border-radius: 30px;
            background-color: #75bba1;
        }
    </style>
</head>
<body>
    <h2>圆角矩形</h2>
    <div class="rounded">圆角和阴影</div>
    <h2>圆形</h2>
    <div class="circle"></div>
    <h2>胶囊形</h2>
    <div class="capsule">胶囊按钮</div>
</body>
</html>
