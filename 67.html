<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综合案例一-产品卡片</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background-color: #f5f5f5; }
        .card {
            width: 234px;
            padding: 20px 0;
            margin: 50px auto;
            background-color: white;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }
        h3 { margin-top: 15px; font-size: 16px; font-weight: 400; color: #333; }
        .description { margin: 8px 0 15px; font-size: 12px; color: #999; }
        .price { color: #ff6700; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <img src="images/产品.svg" alt="运动手环" width="160" height="160">
        <h3>智能运动手环</h3>
        <p class="description">记录运动，关注日常健康</p>
        <p class="price">199 元</p>
    </div>
</body>
</html>
