<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>结构伪类选择器</title>
    <style>
        li:nth-child(3){
        background-color: green;
      /*E:first-child查找第一个E元素
      E:last-child 查找最后一个E元素
      E:nth-child(N)  查找第N个元素  第一个元素为N */
      偶数:2n  奇数2n-1 / 2n+1
      五的倍数5n  
      找到第五个以后的标签 n+5
      找到第五个以前的标签 -n+5  n为0
        }
    </style>
</head>
<body>
    <li>li 1</li>
    <li>li 2</li>
    <li>li 3</li>
    <li>li 4</li>
    <li>li 5</li>
    <li>li 6</li>
    
</body>
</html>
