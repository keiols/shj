<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注释</title>
    <style>
        /* CSS 注释写在样式中 */
        p {
            color: green;
        }
    </style>
</head>
<body>
    <!-- HTML 注释不会显示在页面上 -->
    <p>这是会显示的内容。</p>
    <!-- <p>这一段被注释掉了。</p> -->
</body>
</html>
