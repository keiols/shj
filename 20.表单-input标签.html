<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单-input标签</title>
</head>
<body>
    <form action="#" method="get">
        <p>用户名：<input type="text" name="username" placeholder="请输入用户名"></p>
        <p>密码：<input type="password" name="password"></p>
        <p>性别：
            <label><input type="radio" name="gender" value="男" checked>男</label>
            <label><input type="radio" name="gender" value="女">女</label>
        </p>
        <p>爱好：
            <label><input type="checkbox" name="hobby" value="阅读">阅读</label>
            <label><input type="checkbox" name="hobby" value="运动">运动</label>
        </p>
        <p>上传头像：<input type="file" accept="image/*"></p>
    </form>
</body>
</html>
