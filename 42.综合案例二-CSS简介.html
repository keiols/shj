<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综合案例二-CSS简介</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; }
        h1 { font-size: 30px; font-weight: 400; text-align: center; }
        h2 { font-size: 22px; color: #333; }
        p { text-indent: 2em; line-height: 1.8; color: #666; }
        .example { color: #005a9c; font-size: 20px; }
    </style>
</head>
<body>
    <h1>CSS 简介</h1>
    <p>CSS 的中文名称是层叠样式表，用于描述网页内容的显示样式。</p>
    <p>HTML 负责内容结构，CSS 可以设置文字颜色、字号、背景以及布局。</p>
    <h2>样式规则的组成</h2>
    <p><strong>选择器</strong>用来查找元素，<strong>声明</strong>用来设置属性和值。</p>
    <p class="example">这段文字使用了单独的类选择器。</p>
</body>
</html>
